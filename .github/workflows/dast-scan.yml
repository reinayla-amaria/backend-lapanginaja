name: DAST Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: db_lapangan
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, xml, bcmath, tokenizer
          tools: composer

      - name: Copy .env
        run: cp .env.example .env

      - name: Set environment variables
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=db_lapangan/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=/' .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed database
        run: php artisan db:seed --force
        continue-on-error: true

      - name: Start Laravel server
        run: php artisan serve --host=0.0.0.0 --port=8000 &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Laravel..."
          timeout 30 bash -c 'until curl -s http://localhost:8000 > /dev/null 2>&1; do sleep 2; done'
          echo "Server is ready!"

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network="host" \
            -u root \
            -v $(pwd):/zap/wrk \
            -t zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8000 \
            -r report.html \
            -J report.json \
            -x report.xml
        continue-on-error: true

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-html
          path: report.html

      - name: Upload JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-json
          path: report.json