name: CI/CD Laravel Docker

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── JOB 1: TESTING ───────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, bcmath

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM and Build Vite
        run: |
          npm install
          npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit tests
        run: php artisan test

  # ─── JOB 2: BUILD & PUSH IMAGE ────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM and Build Vite
        run: |
          npm install
          npm run build

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 3: DEPLOY KE VPS ────────────────────────────────
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 8022
          command_timeout: 30m
          script: |
            set -e
            set -x

            echo "🚀 Mulai deployment..."

            # Login ke GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Masuk ke folder project
            cd /home/${{ secrets.SERVER_USER }}/RPL2B-kelompok-6

            # Paksa hapus file compose.yml kosong jika ada
            rm -f compose.yml

            # Matikan container lama
            docker-compose -f docker-compose.yml down --remove-orphans || true

            # Force remove kalau container masih nyangkut
            docker rm -f lapanginaja_app || true

            # Pull image terbaru
            docker pull ghcr.io/${{ github.repository }}:latest

            # Jalankan ulang
            docker-compose -f docker-compose.yml up -d --remove-orphans

            # Tunggu container ready
            sleep 5

            # Copy .env ke container
            docker cp /home/${{ secrets.SERVER_USER }}/RPL2B-kelompok-6/.env lapanginaja_app:/var/www/html/.env

            # Cache config
            docker exec lapanginaja_app php /var/www/html/artisan config:cache

            echo "⏳ Menunggu database benar-benar sehat..."
            for i in {1..20}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' db_lapangan || echo "starting")
              if [ "$STATUS" == "healthy" ]; then
                echo "✅ Database siap!"
                break
              fi
              echo "Database status: $STATUS. Menunggu 5 detik... ($i/20)"
              sleep 5
              if [ $i -eq 20 ]; then
                echo "❌ Database gagal healthy setelah 100 detik!"
                exit 1
              fi
            done

            echo "🏃 Jalankan migrasi..."
            docker-compose -f docker-compose.yml exec -T app php artisan migrate --force --no-interaction

            echo "✅ sudahh!"